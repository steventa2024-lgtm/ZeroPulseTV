// ZeroPulse TV build (Gradle + Android Gradle Plugin, Java only). See docs/BUILDING.md.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'ZeroPulseTV'
include ':launcher'
